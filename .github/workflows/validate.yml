name: Validate extension package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax and behavior contracts
        run: |
          for file in background.js sidepanel.js lib/*.js; do node --check "$file"; done
          npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Installed extension browser smoke
        run: npm run test:browser
      - name: Package runtime files
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: pff-search-extension
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
